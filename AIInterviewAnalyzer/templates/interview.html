<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview | AI Interview Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/interview.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <h1>🎤 AI Interview</h1>

    <h3>Welcome, {{ username }}</h3>

    <div class="question-box">

        <h2 id="questionNumber">Question 1</h2>

        <p id="question">
            Tell me about yourself.
        </p>

    </div>

    <div class="buttons">

    <button id="startBtn">🎙 Start Recording</button>

    <button id="stopBtn">⏹ Stop Recording</button>

    <button id="nextBtn">➡ Next Question</button>

</div>

<div class="answer-box">

    <h3>Your Answer</h3>

    <textarea
        id="answer"
        placeholder="Your answer will appear here..."
        readonly>
    </textarea>

</div>

</div>

<script src="{{ url_for('static', filename='js/interview.js') }}"></script>

</body>
</html>
