<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/resume.css') }}">
</head>
<body>

<div class="container">

    <h1>📄 Upload Your Resume</h1>

    <form action="/upload_resume" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="resume"
            accept=".pdf,.doc,.docx"
            required>

        <br><br>

        <button type="submit">
            Upload Resume
        </button>

    </form>

</div>

</body>
</html>
